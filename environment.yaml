# AI Professor Lite manual runtime environment
#
# Keep this environment aligned with the Dockerfile runtime:
#   - Python 3.10
#   - PyTorch 2.3.1 / torchvision 0.18.1 / torchaudio 2.3.1
#   - CUDA 12.1 PyTorch wheels
#   - NumPy 2.0.1
#   - TensorRT 8.6.1
#
# Application dependencies remain sourced from requirements.txt so the
# application dependency set is not duplicated here.
#
# Create with:
#   conda env create -f environment.yaml
#   conda activate ditto

name: ditto

channels:
  - defaults

dependencies:
  - python=3.10
  - pip

  - pip:
      # Dockerfile upgrades these before installing the application stack.
      - setuptools
      - wheel
      - packaging

      # Application dependency source of truth.
      - -r requirements.txt

      # PyTorch CUDA 12.1 stack (Dockerfile-aligned).
      # The extra index exposes the cu121 wheels while keeping PyPI available
      # for the rest of the dependency set.
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - torch==2.3.1
      - torchvision==0.18.1
      - torchaudio==2.3.1

      # Ditto runtime dependencies (Dockerfile-aligned).
      - numpy==2.0.1
      - audioread==3.0.1
      - cuda-python==12.1.0
      - cython==3.0.11
      - decorator==5.1.1
      - einops==0.8.1
      - filetype==1.2.0
      - imageio==2.36.1
      - imageio-ffmpeg==0.5.1
      - joblib==1.4.2
      - lazy-loader==0.4
      - librosa==0.10.2.post1
      - llvmlite==0.43.0
      - msgpack==1.1.0
      - numba==0.60.0
      - opencv-python-headless==4.10.0.84
      - platformdirs==4.3.6
      - pooch==1.8.2
      - pyyaml==6.0.2
      - requests==2.32.3
      - scikit-image==0.25.0
      - scikit-learn==1.6.0
      - scipy==1.15.0
      - soundfile==0.13.0
      - soxr==0.5.0.post1
      - threadpoolctl==3.5.0
      - tifffile==2024.12.12
      - tqdm==4.67.1

      # TensorRT 8.6.1 (Dockerfile-aligned).
      - --extra-index-url https://pypi.nvidia.com
      - tensorrt-bindings==8.6.1
      - tensorrt-libs==8.6.1
      - tensorrt==8.6.1
      - polygraphy
      - colored
