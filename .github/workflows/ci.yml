name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.10 / lint + test
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      SESSION_SECRET: "ci-only-session-secret-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.15.22"
          args: "check ."

      - name: Validate translation XML
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          paths = sorted(Path("core/lang/xml").glob("*.xml"))
          if not paths:
              raise SystemExit("No translation XML files found")

          for path in paths:
              ET.parse(path)
              print("OK:", path)
          PY

      - name: Byte-compile application
        run: |
          python -m compileall -q app.py core modules worker.py

      - name: Run tests
        run: |
          pytest -q
